<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jonli dars — MyTeacher</title>
<style>
  :root{ --bg:#0f1420; --card:#19202f; --line:#2a3346; --fg:#eaf0fb; --mut:#93a0b8; --acc:#3b82f6; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
  h1{margin:0 0 4px;font-size:20px}
  p.sub{margin:0 0 20px;color:var(--mut);font-size:13px}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#111827;color:var(--fg);font-size:15px}
  input:focus{outline:2px solid var(--acc);outline-offset:-1px}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .roles button{padding:11px;border-radius:10px;border:1px solid var(--line);background:#111827;color:var(--mut);cursor:pointer;font-size:14px}
  .roles button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .go{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .go:disabled{opacity:.5;cursor:not-allowed}
  .hint{margin-top:14px;font-size:12px;color:var(--mut)}
  code{background:#111827;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
  <div class="card">
    <h1>Jonli dars</h1>
    <p class="sub">Ustoz va o‘quvchi uchun 1:1 video xona</p>

    <label for="room">Xona nomi</label>
    <input id="room" placeholder="masalan: dars-101" autocapitalize="off" autocomplete="off">

    <label for="name">Ismingiz</label>
    <input id="name" placeholder="Ism" autocomplete="name">

    <label>Rolingiz</label>
    <div class="roles">
      <button type="button" data-role="teacher" aria-pressed="true">Ustoz</button>
      <button type="button" data-role="student" aria-pressed="false">O‘quvchi</button>
    </div>

    <button class="go" id="go">Darsga kirish</button>
    <p class="hint">Ikkinchi ishtirokchi <b>xuddi shu xona nomi</b> bilan kirsin. Ustoz PDF ochadi va belgi qo‘yadi — o‘quvchida bir zumda ko‘rinadi.</p>
  </div>

<script>
  const $ = (s) => document.querySelector(s);
  let role = 'teacher';

  document.querySelectorAll('.roles button').forEach((b) => {
    b.onclick = () => {
      role = b.dataset.role;
      document.querySelectorAll('.roles button').forEach((x) =>
        x.setAttribute('aria-pressed', String(x === b)));
    };
  });

  // URL'dan oldindan to'ldirish: ?room=dars-101&role=student
  const q = new URLSearchParams(location.search);
  if (q.get('room')) $('#room').value = q.get('room');
  if (q.get('role') === 'student') document.querySelector('[data-role="student"]').click();
  $('#name').value = localStorage.getItem('ll-name') || '';

  $('#go').onclick = () => {
    const room = $('#room').value.trim().toLowerCase().replace(/[^a-z0-9\-]+/g, '-');
    if (room.length < 3) { $('#room').focus(); return alert('Xona nomi kamida 3 ta belgi bo‘lsin'); }
    const name = $('#name').value.trim();
    localStorage.setItem('ll-name', name);
    location.href = `room.html?room=${encodeURIComponent(room)}&role=${role}&name=${encodeURIComponent(name)}`;
  };
  $('#room').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#go').click(); });
</script>
</body>
</html>
