<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Dars band qilish — Jonli dars</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <div class="sahifa-bosh">
    <h1>Darslarim</h1>
    <div class="izoh" id="who"></div>
  </div>

  <div class="karta-oq">
    <h2>Band qilingan darslar</h2>
    <div id="darslar"><div class="izoh">Yuklanmoqda…</div></div>
  </div>

  <div class="karta-oq">
    <h2 id="mentorNomi">Ustozim</h2>
    <div class="izoh">Kun tanlang, so‘ng bo‘sh vaqtni bosing — dars 30 daqiqa davom etadi.</div>
    <div class="sana-lenta" id="sanalar"></div>
    <div class="slot-setka" id="slotlar"></div>
    <div class="xabar2" id="xabar" style="margin-top:12px"></div>
  </div>
</div>

<script src="/auth-webview.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let MENTOR_ID = null;
let SANA = null;

let SESSIYA_BOR = false;

function xabar(t, turi) {
  $('#xabar').textContent = t;
  $('#xabar').className = 'xabar2 ' + (turi || '');
  if (turi === 'ok') setTimeout(() => { $('#xabar').textContent = ''; }, 3000);
}

const vaqtMatni = (iso) => sanaChiroyli(iso);

// Toshkent vaqtidagi YYYY-MM-DD
function sanaMatni(d) {
  return new Date(d.getTime() + 5 * 3600_000).toISOString().slice(0, 10);
}

function sanalarniChiz() {
  const box = $('#sanalar');
  box.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(Date.now() + i * 86400_000);
    const key = sanaMatni(d);
    const btn = document.createElement('button');
    btn.className = 'sana-tug';
    btn.setAttribute('aria-pressed', String(i === 0));
    btn.innerHTML = `${d.toLocaleDateString('uz-UZ', { weekday: 'short' })}<b>${d.getDate()}</b>`;
    btn.onclick = () => {
      document.querySelectorAll('.sana-tug').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      SANA = key;
      slotlarniYukla();
    };
    if (i === 0) SANA = key;
    box.appendChild(btn);
  }
}

async function slotlarniYukla() {
  const box = $('#slotlar');
  if (!MENTOR_ID) { box.innerHTML = '<div class="izoh">Sizga ustoz biriktirilmagan</div>'; return; }
  box.innerHTML = '<div class="izoh">Yuklanmoqda…</div>';

  const r = await api(`/api/booking/slots?mentorId=${MENTOR_ID}&date=${SANA}`);
  if (!r) return;
  if (!r.ok || !Array.isArray(r.data) || !r.data.length) {
    box.innerHTML = '<div class="izoh">Bu kunda bo‘sh vaqt yo‘q</div>';
    return;
  }

  box.innerHTML = '';
  for (const slot of r.data) {
    const btn = document.createElement('button');
    btn.className = 'slot';
    btn.textContent = new Date(slot.startsAt)
      .toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
    btn.disabled = !slot.available;
    btn.onclick = () => bandQil(slot.startsAt, btn);
    box.appendChild(btn);
  }
}

async function bandQil(startsAt, btn) {
  btn.disabled = true;
  const r = await api('/api/booking', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mentorId: MENTOR_ID, startsAt }),
  });
  if (!r) return;
  if (r.ok) {
    xabar('Dars band qilindi', 'ok');
    await Promise.all([darslarniYukla(), slotlarniYukla()]);
  } else {
    btn.disabled = false;
    xabar(r.data.message || 'Band qilib bo‘lmadi', 'err');
  }
}

async function darslarniYukla() {
  const r = await api('/api/booking/my');
  if (!r) return;
  const box = $('#darslar');
  if (!r.ok || !Array.isArray(r.data) || !r.data.length) {
    box.innerHTML = '<div class="izoh">Band qilingan dars yo‘q</div>';
    return;
  }
  box.innerHTML = '';
  for (const d of r.data) {
    const row = document.createElement('div');
    row.className = 'dars-karta';
    row.style.margin = '0 0 10px';
    row.style.padding = '12px';
    row.innerHTML = `<span class="matn"><b>${vaqtMatni(d.startsAt)}</b>
      <span>${d.mentorName || 'Ustoz'}</span></span>`;

    const kir = document.createElement('button');
    kir.className = 'kirish';
    kir.textContent = 'Kirish';
    kir.onclick = async () => {
      kir.disabled = true;
      const e = await api(`/api/booking/${d.id}/entry`);
      kir.disabled = false;
      if (!e) return;
      if (e.ok && e.data.url) location.href = e.data.url;
      else xabar(e.data.message || 'Hozircha kirib bo‘lmaydi', 'err');
    };

    const bekor = document.createElement('button');
    bekor.className = 'kirish';
    bekor.style.background = '#f2f2ef';
    bekor.style.color = '#6b6e76';
    bekor.textContent = 'Bekor';
    bekor.onclick = async () => {
      if (!confirm('Darsni bekor qilasizmi?')) return;
      await api(`/api/booking/${d.id}/cancel`, { method: 'PATCH' });
      await Promise.all([darslarniYukla(), slotlarniYukla()]);
    };

    row.append(kir, bekor);
    box.appendChild(row);
  }
}

(async () => {
  await WebViewAuth.tayyorla();
  const w = await api('/api/whoami');
  if (!w) return;
  SESSIYA_BOR = w.ok;
  if (w.ok && w.data.name) $('#who').textContent = w.data.name;

  const m = await api('/api/my-mentor');
  if (m && m.ok && m.data) {
    const a = m.data;
    MENTOR_ID = a.mentorId || a.mentor?.id || null;
    const u = a.mentor?.user;
    if (u) $('#mentorNomi').textContent = `Ustozim: ${[u.firstName, u.lastName].filter(Boolean).join(' ')}`;
  }

  sanalarniChiz();
  await Promise.all([darslarniYukla(), slotlarniYukla()]);
})();
</script>
</body>
</html>
