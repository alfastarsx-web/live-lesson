<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lidlar</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <div class="sahifa-bosh">
    <h1>Lidlar</h1>
    <div class="izoh" id="izoh">Yuklanmoqda…</div>
  </div>

  <nav class="nav">
    <a href="/jadval.html">Jadval</a>
    <a href="/oquvchilar.html">O‘quvchilar</a>
    <a href="/lidlar.html" aria-current="page">Lidlar</a>
  </nav>

  <div class="chiplar" id="chiplar">
    <button class="chip" data-t="all" aria-pressed="true">Barchasi (0)</button>
    <button class="chip" data-t="new" aria-pressed="false">Yangi (0)</button>
    <button class="chip" data-t="negotiating" aria-pressed="false">Muzokarada (0)</button>
    <button class="chip" data-t="trial_scheduled" aria-pressed="false">Sinov darsi (0)</button>
    <button class="chip" data-t="trial_completed" aria-pressed="false">O‘tilgan (0)</button>
  </div>

  <div id="royxat"><div class="skelet"></div><div class="skelet"></div></div>
</div>

<script src="/auth-webview.js"></script>
<script>
const $ = (s) => document.querySelector(s);
// Telegramdagi ism foydalanuvchi kiritgan matn — HTML sifatida talqin qilinmasin
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let HAMMASI = [];
let FILTR = 'all';

function sinovKirishHtml(l) {
  if (l.status !== 'trial_scheduled' || !l.trialBookingId || !l.trialStartsAt ||
      Date.parse(l.trialEndsAt) + 10 * 60_000 <= Date.now()) return '';
  return `<div class="sinov-kirish" data-trial-panel data-booking-id="${esc(l.trialBookingId)}" data-start="${esc(l.trialStartsAt)}" data-end="${esc(l.trialEndsAt)}">
    <div class="sinov-kirish-bosh">
      <span class="sinov-kirish-belgi" aria-hidden="true">▶</span>
      <div class="sinov-kirish-matn">
        <span class="sinov-kirish-yorliq">BELGILANGAN SINOV DARSI</span>
        <strong>${esc(sanaChiroyli(l.trialStartsAt))}</strong>
        <small data-trial-status></small>
      </div>
    </div>
    <button type="button" data-sinov-kirish>Darsga kirish <span aria-hidden="true">↗</span></button>
  </div>`;
}

function sinovVaqtiniYangila() {
  document.querySelectorAll('[data-trial-panel]').forEach((panel) => {
    const opensAt = Date.parse(panel.dataset.start) - 10 * 60_000;
    const closesAt = Date.parse(panel.dataset.end) + 10 * 60_000;
    const btn = panel.querySelector('[data-sinov-kirish]');
    const status = panel.querySelector('[data-trial-status]');
    if (!Number.isFinite(opensAt) || !Number.isFinite(closesAt) || Date.now() >= closesAt) {
      panel.hidden = true;
    } else if (Date.now() < opensAt) {
      btn.disabled = true;
      status.textContent = 'Kirish darsdan 10 daqiqa oldin ochiladi';
    } else {
      btn.disabled = false;
      status.textContent = 'Dars xonasi ochiq';
    }
  });
}

const HOLATLAR = {
  new:             { matn: 'Yangi' },
  assigned:        { matn: 'Yangi' },
  unreachable:     { matn: 'Ulanib bo‘lmadi' },
  negotiating:     { matn: 'Muzokarada' },
  trial_scheduled: { matn: 'Sinov darsi belgilandi' },
  trial_completed: { matn: 'Sinov darsi o‘tildi' },
  trial_no_show:   { matn: 'Sinov darsiga kelmadi' },
  converted:       { matn: 'O‘quvchiga aylandi' },
  lost:            { matn: 'Qiziqmadi' },
};

function kartaHtml(l) {
  const h = HOLATLAR[l.status] || { matn: l.status };
  return `
    <div class="lid l-${l.status}${javobKutmoqda(l) ? ' kutmoqda' : ''}" data-id="${l.id}">
      ${javobKutmoqda(l) ? '<div class="kutmoqda-belgi">Dars o\u2018tdi — natijasini belgilang</div>' : ''}
      <div class="tepa">
        <div class="avatar">${bosh(l.name)}</div>
        <div class="ism">
          <b>${l.name || 'Noma‘lum'}</b>
          <a href="tel:${l.phoneNumber}">${l.phoneNumber || ''}</a>
        </div>
        <span class="holat-yorliq">${h.matn}</span>
      </div>

      ${akkauntHtml(l)}

      <div class="izohi" data-izoh-korinish ${l.note ? '' : 'hidden'}>${l.note || ''}</div>
      <div data-izoh-tahrir hidden style="margin-top:10px">
        <textarea data-izoh-matn rows="3" placeholder="Nima gaplashildi, qachon qayta bog‘lanish kerak…"
          style="width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--line);
                 font:inherit;font-size:14px;resize:vertical">${l.note || ''}</textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button data-izoh-saqla style="padding:9px 14px;border-radius:10px;border:0;background:var(--blue);
                  color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer">Saqlash</button>
          <button data-izoh-yop style="padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);
                  background:#fff;font:inherit;font-size:13px;font-weight:700;color:var(--mut2);cursor:pointer">Yopish</button>
        </div>
      </div>

      <div class="amallari">
        <a href="tel:${l.phoneNumber}" style="text-decoration:none">
          <button class="qongiroq" type="button">Telefon qilish</button></a>
        <button data-h="unreachable">Ulanib bo‘lmadi</button>
        <button data-h="negotiating">Muzokarada</button>
        ${l.status === 'trial_scheduled' ? '<button data-h="trial_completed" class="asosiy">Sinov darsi o‘tildi</button>' : ''}
        ${l.status === 'trial_scheduled' ? '<button data-h="trial_no_show">Kelmadi</button>' : ''}
        ${l.status === 'trial_completed' ? '<button data-h="converted" class="asosiy">O‘quvchiga aylandi</button>' : ''}
        <button data-izoh>Izoh</button>
        ${l.akkauntHolati === 'yoq' ? '<button class="asosiy" data-akkaunt>Akkaunt ochish</button>' : ''}
        <button class="asosiy" data-sinov="1">Sinov darsi</button>
      </div>
      ${sinovKirishHtml(l)}
      <div class="xabar2" data-akkaunt-xabar hidden style="margin-top:10px"></div>

      <div class="sinov-quti" data-sinov-quti hidden>
        <b>Sinov darsi vaqti</b>
        <input type="datetime-local" data-vaqt
               style="width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);font:inherit">
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="asosiy" data-tasdiq style="padding:10px 14px;border-radius:10px;border:0;
                  background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer">Belgilash</button>
          <button data-bekor style="padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);
                  background:#fff;font:inherit;font-weight:700;color:var(--mut2);cursor:pointer">Yopish</button>
        </div>
        <div class="xabar2" data-xabar style="margin-top:10px"></div>
      </div>
    </div>`;
}

/**
 * O'quvchining ilovadagi holati. Mentor telefonda nima deyishini shu belgilaydi:
 * kod bo'lsa aytadi, akkaunt avvaldan bo'lsa "o'z parolingiz bilan kiring" deydi.
 */
function akkauntHtml(l) {
  if (l.akkauntHolati === 'kod' && l.kirishKodi) {
    return `<div class="akkaunt akkaunt-kod">
      <b>Ilovaga kirish kodi</b>
      <div class="kod">${l.kirishKodi}</div>
      <span>O‘quvchiga ayting: telefon raqami va shu kod bilan kirsin</span>
    </div>`;
  }
  if (l.akkauntHolati === 'bor') {
    return `<div class="akkaunt">
      <b>Ilovada akkaunti bor</b>
      <span>O‘z paroli bilan kiradi. Esidan chiqqan bo‘lsa — “Parolni unutdingizmi?”</span>
    </div>`;
  }
  // Botga raqamini yuborgan, lekin akkaunti hali yo'q — mentor "Akkaunt ochish" ni bosadi
  if (l.trialTgId) {
    return `<div class="akkaunt akkaunt-tg">
      <b>Telegramda kutmoqda${l.trialTgName ? ` — ${esc(l.trialTgName)}` : ''}</b>
      <span>${l.trialTgVerified
        ? 'Raqami Telegram orqali tasdiqlangan ✅ “Akkaunt ochish” bosilsa login va parol shu yerga boradi.'
        : 'Raqamni o‘zi yozib yubordi (tasdiqlanmagan). Telefonda gaplashayotgan odam shu ekanini tekshiring, so‘ng “Akkaunt ochish” ni bosing.'}</span>
    </div>`;
  }
  return '';
}

/**
 * Sinov darsi vaqti o'tgan, lekin mentor hali natijasini belgilamagan.
 * Bunday lidlar ro'yxat boshida va ajralib turadi — aks holda ular
 * "belgilandi" holatida osilib qoladi va konversiya noto'g'ri chiqadi.
 */
function javobKutmoqda(l) {
  if (l.status !== 'trial_scheduled' || !l.trialEndsAt) return false;
  return new Date(l.trialEndsAt).getTime() < Date.now();
}

// Admin qo'lda biriktirgan lid `assigned` bo'lib keladi — mentor uchun u ham yangi ish
function tegishli(x, t) {
  if (t === 'all') return true;
  if (t === 'new') return x.status === 'new' || x.status === 'assigned';
  return x.status === t;
}

function sanoq() {
  const son = (t) => t === 'all' ? HAMMASI.length : HAMMASI.filter((x) => tegishli(x, t)).length;
  document.querySelectorAll('.chip').forEach((c) => {
    const nom = {
      all: 'Barchasi', new: 'Yangi', negotiating: 'Muzokarada',
      trial_scheduled: 'Sinov darsi', trial_completed: 'O‘tilgan',
    }[c.dataset.t];
    c.textContent = `${nom} (${son(c.dataset.t)})`;
  });
}

function chiz() {
  let ro = HAMMASI.filter((x) => tegishli(x, FILTR));
  // Javob kutayotganlar tepada — ular bir bosishda yopiladi
  ro = [...ro].sort((a, b) => (javobKutmoqda(b) ? 1 : 0) - (javobKutmoqda(a) ? 1 : 0));
  $('#royxat').innerHTML = ro.length
    ? ro.map(kartaHtml).join('')
    : '<div class="bosh-holat"><b>Lid yo‘q</b><span>Bu bo‘limda hozircha lid yo‘q</span></div>';

  document.querySelectorAll('.lid').forEach((k) => {
    const id = k.dataset.id;
    const quti = k.querySelector('[data-sinov-quti]');

    k.querySelectorAll('[data-h]').forEach((b) => {
      b.onclick = () => holatQoy(id, b.dataset.h, b);
    });
    k.querySelector('[data-sinov]').onclick = () => { quti.hidden = !quti.hidden; };

    const korinish = k.querySelector('[data-izoh-korinish]');
    const tahrir = k.querySelector('[data-izoh-tahrir]');
    k.querySelector('[data-izoh]').onclick = () => { tahrir.hidden = !tahrir.hidden; };
    tahrir.querySelector('[data-izoh-yop]').onclick = () => { tahrir.hidden = true; };
    tahrir.querySelector('[data-izoh-saqla]').onclick = async (e) => {
      const matn = tahrir.querySelector('[data-izoh-matn]').value;
      e.target.disabled = true;
      const r = await api(`/api/ai/leads/${id}/note`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note: matn }),
      });
      e.target.disabled = false;
      if (!r) return;
      if (!r.ok) return alert(r.data.message || 'Saqlab bo‘lmadi');

      const lid = HAMMASI.find((x) => x.id === id);
      if (lid) lid.note = matn.trim() || null;
      korinish.textContent = matn.trim();
      korinish.hidden = !matn.trim();
      tahrir.hidden = true;
    };
    const akkauntTugma = k.querySelector('[data-akkaunt]');
    if (akkauntTugma) akkauntTugma.onclick = () => akkauntOch(id, akkauntTugma, k);
    const kirishTugma = k.querySelector('[data-sinov-kirish]');
    if (kirishTugma) kirishTugma.onclick = () => sinovgaKir(id, kirishTugma);
    quti.querySelector('[data-bekor]').onclick = () => { quti.hidden = true; };
    quti.querySelector('[data-tasdiq]').onclick = () => sinovBelgila(id, quti);
  });
  sinovVaqtiniYangila();
}

async function sinovgaKir(id, tugma) {
  const lid = HAMMASI.find((x) => x.id === id);
  if (!lid?.trialBookingId) return alert('Sinov darsi topilmadi. Sahifani yangilang.');
  if (Date.now() < new Date(lid.trialStartsAt).getTime() - 10 * 60_000) {
    return alert(`Sinov darsi ${sanaChiroyli(lid.trialStartsAt)} da boshlanadi. Kirish 10 daqiqa oldin ochiladi.`);
  }
  tugma.disabled = true;
  const r = await api(`/api/booking/${lid.trialBookingId}/entry`);
  tugma.disabled = false;
  if (!r) return;
  if (r.ok && r.data.url) location.href = r.data.url;
  else alert(r.data.message || 'Hozircha darsga kirib bo‘lmaydi');
}

async function holatQoy(id, status, btn) {
  btn.disabled = true;
  const r = await api(`/api/ai/leads/${id}/status`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status }),
  });
  btn.disabled = false;
  if (!r) return;
  if (!r.ok) return alert(r.data.message || 'O‘zgartirib bo‘lmadi');
  const lid = HAMMASI.find((x) => x.id === id);
  if (lid) lid.status = status;
  sanoq(); chiz();
}

/** Bitta tugma: akkaunt ochiladi, login va parol o'quvchiga Telegram (yoki SMS) orqali ketadi. */
async function akkauntOch(id, tugma, karta) {
  const xabar = karta.querySelector('[data-akkaunt-xabar]');
  tugma.disabled = true;
  tugma.textContent = 'Ochilmoqda…';
  const r = await api(`/api/ai/leads/${id}/create-account`, { method: 'POST' });
  if (!r) return;
  if (!r.ok) {
    tugma.disabled = false;
    tugma.textContent = 'Akkaunt ochish';
    xabar.hidden = false;
    xabar.className = 'xabar2 err';
    xabar.textContent = r.data.message || 'Akkaunt ochib bo‘lmadi';
    return;
  }

  const d = r.data;
  const lid = HAMMASI.find((x) => x.id === id);
  if (lid) {
    lid.akkauntHolati = d.holat === 'created' ? 'kod' : 'bor';
    lid.kirishKodi = d.kod || null;
  }
  chiz();

  // chiz() kartani qayta yasadi — xabarni yangi kartaga qo'yamiz
  const yangi = document.querySelector(`.lid[data-id="${id}"] [data-akkaunt-xabar]`);
  if (!yangi) return;
  const yetdi = d.telegram === 'sent'
    ? 'Login va parol o‘quvchiga Telegramga yuborildi ✅'
    : d.sms
      ? 'Telegram ulanmagan — parol SMS bilan yuborildi. Kod yuqorida ko‘rinib turibdi.'
      : d.holat === 'created' ? 'Yuborib bo‘lmadi — kodni o‘quvchiga o‘zingiz ayting.' : '';
  yangi.hidden = false;
  yangi.className = 'xabar2';
  yangi.textContent = d.holat === 'existing'
    ? `Akkaunt avvaldan bor edi — parolga tegilmadi.${d.telegram === 'sent' ? ' Telegramga eslatma yuborildi.' : ''}`
    : `Akkaunt ochildi. Login: ${d.login}. ${yetdi}`;
}

async function sinovBelgila(id, quti) {
  const xabar = quti.querySelector('[data-xabar]');
  const qiymat = quti.querySelector('[data-vaqt]').value;
  if (!qiymat) { xabar.textContent = 'Vaqtni tanlang'; xabar.className = 'xabar2 err'; return; }

  const tasdiq = quti.querySelector('[data-tasdiq]');
  tasdiq.disabled = true;
  const r = await api('/api/booking/trial', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ leadId: id, startsAt: new Date(qiymat).toISOString() }),
  });
  tasdiq.disabled = false;
  if (!r) return;

  if (!r.ok) {
    xabar.textContent = r.data.message || 'Belgilab bo‘lmadi';
    xabar.className = 'xabar2 err';
    return;
  }

  const lid = HAMMASI.find((x) => x.id === id);
  if (lid) lid.status = 'trial_scheduled';
  if (lid) {
    lid.trialBookingId = r.data.id;
    lid.trialStartsAt = r.data.startsAt;
    lid.trialEndsAt = new Date(new Date(r.data.startsAt).getTime() + r.data.durationMin * 60_000).toISOString();
  }
  const a = r.data.akkaunt || {};
  if (lid) {
    lid.akkauntHolati = a.holat === 'created' ? 'kod' : (a.holat === 'existing' ? 'bor' : lid.akkauntHolati);
    lid.kirishKodi = a.kod || null;
  }
  // Telegram havolasi bo'lsa — asosiy yo'l: o'quvchi kod termaydi
  const tgBolimi = a.telegramUrl
    ? `<div class="akkaunt akkaunt-tg" style="margin:10px 0 0">
         <b>Telegram havolasi — shuni yuboring</b>
         <span>O‘quvchi bosadi, raqamini tasdiqlaydi va darsiga o‘tadi. Kod terish shart emas.</span>
         <div class="havola-quti" style="margin-top:8px">
           <code>${a.telegramUrl}</code><button type="button" id="tg-${id}">Nusxa</button>
         </div>
       </div>`
    : '';

  const akkauntBolimi = a.kod
    ? `<div class="akkaunt akkaunt-kod" style="margin:10px 0 0">
         <b>${a.telegramUrl ? 'Zaxira: SMS kodi' : 'Ilovaga kirish kodi'}</b>
         <div class="kod">${a.kod}</div>
         <span>${a.telegramUrl
           ? 'Telegram ishlatmasa — telefon raqami va shu kod bilan kiradi'
           : 'O‘quvchiga ayting: telefon raqami va shu kod bilan kirsin'}</span>
       </div>`
    : (a.holat === 'existing'
      ? `<div class="akkaunt" style="margin:10px 0 0"><b>Ilovada akkaunti bor</b>
           <span>O‘z paroli bilan kiradi</span></div>`
      : '');

  quti.innerHTML = `<b>Sinov darsi belgilandi</b>
    <div class="izoh" style="margin-bottom:8px">${sanaChiroyli(r.data.startsAt)} — o‘quvchi darsni ilovadan ochadi</div>
    ${sinovKirishHtml(lid)}
    ${tgBolimi}
    ${akkauntBolimi}
    <div class="izoh" style="margin:10px 0 6px">Ilovasiz kirish uchun zaxira havola:</div>
    <div class="havola-quti"><code>${r.data.joinUrl}</code><button type="button" id="n-${id}">Nusxa</button></div>`;
  document.getElementById(`n-${id}`).onclick = (e) => {
    navigator.clipboard.writeText(r.data.joinUrl).then(() => { e.target.textContent = 'Nusxalandi'; }, () => {});
  };
  quti.querySelector('[data-sinov-kirish]').onclick = (e) => sinovgaKir(id, e.target);
  sinovVaqtiniYangila();
  const tgTugma = document.getElementById(`tg-${id}`);
  if (tgTugma) {
    tgTugma.onclick = (e) => {
      navigator.clipboard.writeText(a.telegramUrl).then(() => { e.target.textContent = 'Nusxalandi'; }, () => {});
    };
  }
  sanoq();
}

document.querySelectorAll('.chip').forEach((c) => {
  c.onclick = () => {
    FILTR = c.dataset.t;
    document.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x === c)));
    chiz();
  };
});

(async () => {
  await WebViewAuth.tayyorla();
  // Mentor shu sahifada ishlayotganini bildirib turamiz — aks holda tizim uni
  // oflayn deb biladi va avtomatik lid bermaydi
  mentorNabzi();
  const r = await api('/api/ai/leads/my');
  if (!r) return;
  if (!r.ok) {
    $('#izoh').textContent = '';
    $('#royxat').innerHTML = '<div class="bosh-holat"><b>Lidlarni yuklab bo‘lmadi</b>'
      + `<span>${r.data.message || 'Qaytadan urinib ko‘ring'}</span></div>`;
    return;
  }
  HAMMASI = Array.isArray(r.data) ? r.data : [];
  // Existing production booking API already exposes the mentor's trial bookings.
  // Use it when the lead response has not yet gained trialBookingId.
  const bookings = await api('/api/booking/mentor/my');
  if (bookings?.ok && Array.isArray(bookings.data)) {
    const byLead = new Map(bookings.data.filter((b) => b.isTrial && b.leadId).map((b) => [b.leadId, b]));
    for (const lead of HAMMASI) {
      const booking = byLead.get(lead.id);
      if (!booking) continue;
      lead.trialBookingId = booking.id;
      lead.trialStartsAt = booking.startsAt;
      lead.trialEndsAt = new Date(Date.parse(booking.startsAt) + booking.durationMin * 60_000).toISOString();
    }
  }
  $('#izoh').textContent = `${HAMMASI.length} ta lid biriktirilgan`;
  sanoq(); chiz();
})();
setInterval(sinovVaqtiniYangila, 15_000);
setInterval(async () => {
  if (document.visibilityState !== 'visible') return;
  const r = await api('/api/booking/mentor/my');
  if (!r?.ok || !Array.isArray(r.data)) return;
  const open = new Set(r.data.filter((b) => b.isTrial).map((b) => b.id));
  document.querySelectorAll('[data-trial-panel]').forEach((panel) => {
    if (!open.has(panel.dataset.bookingId)) panel.hidden = true;
  });
}, 15_000);
</script>
</body>
</html>
