<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ustoz kirishi — Jonli dars</title>
<style>
  :root{ --bg:#0f1420; --card:#19202f; --line:#2a3346; --fg:#eaf0fb; --mut:#93a0b8; --acc:#3b82f6; --err:#f87171; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
  .card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
  h1{margin:0 0 4px;font-size:20px}
  p.sub{margin:0 0 22px;color:var(--mut);font-size:13px}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#111827;color:var(--fg);font-size:15px}
  input:focus{outline:2px solid var(--acc);outline-offset:-1px}
  button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:var(--acc);
         color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .err{margin-top:14px;color:var(--err);font-size:13px;min-height:18px}
  .hint{margin-top:18px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>Ustoz kirishi</h1>
    <p class="sub">Darsni boshlash uchun tizimga kiring</p>

    <label for="login">Login</label>
    <input id="login" autocomplete="username" autocapitalize="off" required>

    <label for="parol">Parol</label>
    <input id="parol" type="password" autocomplete="current-password" required>

    <button type="submit" id="go">Kirish</button>
    <div class="err" id="err"></div>

    <p class="hint">O‘quvchilar bu sahifadan kirmaydi — ular kurs havolasidan to‘g‘ridan-to‘g‘ri xonaga tushadi.</p>
  </form>

<script>
  const $ = (s) => document.querySelector(s);
  const keyin = new URLSearchParams(location.search).get('keyin');

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#err').textContent = '';
    $('#go').disabled = true;
    $('#go').textContent = 'Kirilmoqda…';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: $('#login').value.trim(), password: $('#parol').value }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Kirib bo‘lmadi');
      location.href = keyin && keyin.startsWith('/') ? keyin : '/room.html';
    } catch (err) {
      $('#err').textContent = err.message;
      $('#go').disabled = false;
      $('#go').textContent = 'Kirish';
    }
  });
</script>
</body>
</html>
