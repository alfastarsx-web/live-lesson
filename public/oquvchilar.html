<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O'quvchilar</title>
<link rel="stylesheet" href="/app.css">
<style>
body.oquvchilar{background:var(--bg)}
.oquvchilar .wrap{padding-bottom:40px}
.oq-bosh{margin:16px 0 14px;border-radius:18px;padding:18px;color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.oq-bosh .yorliq{padding:0;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.oq-bosh h1{margin:8px 0 2px;font-size:27px;font-weight:800;letter-spacing:-.6px}
.oq-bosh p{margin:0;font-size:14px;color:var(--mut2)}
.oq-bosh p b{color:var(--amber)}

.oq{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;
  box-shadow:0 1px 2px rgba(35,38,45,.05),0 8px 22px -16px rgba(35,38,45,.25)}
.oq:focus-visible{outline:3px solid #b0874a;outline-offset:2px}
.oq-ust{display:flex;align-items:center;gap:12px}
.oq-ust .avatar{flex:0 0 auto}
.oq-ust .ism{flex:1;min-width:0}
.oq-ust .ism b{display:block;font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oq-ust .ism span{font-size:13px;color:#6b6e76;font-weight:600}
.tarif{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#e8f0ee;color:#2f5751;margin-bottom:8px}

.obuna{margin-top:14px}
.obuna-qator{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:#3a3d45}
.obuna-qator > span:last-child{color:#3d7d5f;font-variant-numeric:tabular-nums;white-space:nowrap}
.oq.tugayapti .obuna-qator > span:last-child{color:#9d7640}
.oq.tugadi .obuna-qator > span:last-child{color:#b85a52}
.chiziq-ob{height:6px;border-radius:6px;background:#e6e6e2;margin-top:7px;overflow:hidden}
.chiziq-ob i{display:block;height:100%;border-radius:6px;background:var(--green)}
.oq.tugayapti .chiziq-ob i{background:#c9a36b}

.oq-past{display:flex;align-items:center;gap:10px;margin-top:14px}
.malumot{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.malumot div{background:#f4f4f1;border-radius:12px;padding:8px 10px}
.malumot small{display:block;font-size:11px;font-weight:700;color:#9a9ca3;white-space:nowrap}
.kutish{margin-top:14px;background:#f6f0e6;border-radius:12px;padding:10px 12px}
.kutish b{display:block;font-size:13.5px;font-weight:800;color:#8a6a36}
.kutish span{font-size:12.5px;color:#7a5d30}
.malumot b{font-size:13.5px;font-weight:800;color:#23262d;font-variant-numeric:tabular-nums}
</style>
</head>
<body class="oquvchilar">
<div class="wrap">
  <section class="oq-bosh" aria-label="O‘quvchilar">
    <div class="yorliq">O‘quvchilar</div>
    <h1 id="sarlavha">…</h1>
    <p id="izoh">Doimiy darslar uchun to‘lov qilgan o‘quvchilaringiz</p>
  </section>

  <nav class="tablar" aria-label="Work bo‘limlari">
    <div class="tablar-ichi statik">
      <a href="/work.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Bugun</span></a>
      <a href="/work.html#sinovlar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.5 5 5.5.8-4 3.9.9 5.5L12 16.1l-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg><span>Sinovlar</span></a>
      <a href="/oquvchilar.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M16 6.5a3 3 0 010 5.6M17.5 14.8c1.6.6 2.6 2 3 4.2"/></svg><span>O‘quvchi</span></a>
      <a href="/jadval.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Jadval</span></a>
      <a href="/daromad.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg><span>Daromad</span></a>
    </div>
  </nav>

  <div class="qidiruv">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
    <input id="qidiruv" placeholder="O‘quvchi qidirish…" autocomplete="off" aria-label="O‘quvchi qidirish">
  </div>

  <div id="royxat">
    <div class="skelet"></div><div class="skelet"></div>
  </div>
</div>

<script src="/auth-webview.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const OYLAR_T = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
const TUGAYAPTI_KUN = 5; // obuna shuncha kun qolganda ogohlantiriladi
let HAMMASI = [];

const IKON = {
  chat: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1.2-4.2A8 8 0 1 1 21 12Z" stroke-linejoin="round"/></svg>',
  qongiroq: '<svg viewBox="0 0 24 24"><path d="M6.6 3h3l1.5 4-2 1.4a12 12 0 0 0 5.5 5.5l1.4-2 4 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4.6 5.2 2 2 0 0 1 6.6 3Z" stroke-linejoin="round"/></svg>',
};

const ism = (s) => s.fullName || [s.firstName, s.lastName].filter(Boolean).join(' ') || 'Noma‘lum';
const sanaUzun = (iso) => { const d = new Date(iso); return `${d.getDate()}-${OYLAR_T[d.getMonth()]}`; };
const kunBoshi = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
function keyingiMatn(iso) {
  if (!iso) return '—';
  const farq = Math.round((kunBoshi(iso) - kunBoshi(Date.now())) / 86400000);
  const soat = soatQisqa(iso);
  if (farq === 0) return `Bugun ${soat}`;
  if (farq === 1) return `Ertaga ${soat}`;
  return `${sanaUzun(iso)} ${soat}`;
}

// Mentor "To'lov qildi" belgilagan, operator hali obunani kiritmagan
function kutilayotganHtml(x) {
  return `
    <div class="oq kutilmoqda" data-id="${esc(x.student.id)}" tabindex="0" role="link" aria-label="${esc(ism(x.student))}">
      <div class="oq-ust">
        <div class="avatar">${esc(bosh(ism(x.student)))}</div>
        <div class="ism">
          <b>${esc(ism(x.student))}</b>
          <span>${x.student.phoneNumber ? esc(x.student.phoneNumber) : 'O‘quvchi'}</span>
        </div>
      </div>
      <div class="kutish">
        <b>To‘lov tasdiqlanmoqda</b>
        <span>Operator to‘lovni kiritgach, tarif va obuna muddati shu yerda chiqadi.</span>
      </div>
      <div class="oq-past">
        <div class="malumot">
          <div><small>Keyingi dars</small><b>${esc(keyingiMatn(x.nextLessonAt))}</b></div>
          <div><small>O‘tilgan darslar</small><b>${x.lessonsDone}</b></div>
        </div>
        <button class="dumaloq" type="button" data-amal="chat" aria-label="Chat">${IKON.chat}</button>
        <button class="dumaloq qongiroq" type="button" data-amal="qongiroq" aria-label="Qo‘ng‘iroq">${IKON.qongiroq}</button>
      </div>
    </div>`;
}

function kartaHtml(x) {
  if (!x.plan) return kutilayotganHtml(x);
  const p = x.plan;
  const jami = Math.max(1, new Date(p.endDate) - new Date(p.startDate));
  const qoldiFoiz = Math.max(0, Math.min(100, ((new Date(p.endDate) - Date.now()) / jami) * 100));
  const holat = p.daysLeft <= 0 ? 'tugadi' : p.daysLeft <= TUGAYAPTI_KUN ? 'tugayapti' : '';
  const qoldi = p.daysLeft <= 0 ? 'bugun tugaydi' : `${p.daysLeft} kun qoldi`;
  return `
    <div class="oq ${holat}" data-id="${esc(x.student.id)}" tabindex="0" role="link" aria-label="${esc(ism(x.student))}">
      <div class="oq-ust">
        <div class="avatar">${esc(bosh(ism(x.student)))}</div>
        <div class="ism">
          <b>${esc(ism(x.student))}</b>
          <span>${x.student.phoneNumber ? esc(x.student.phoneNumber) : 'O‘quvchi'}</span>
        </div>
      </div>
      <div class="obuna">
        <span class="tarif">${esc(p.name)}</span>
        <div class="obuna-qator"><span>Obuna ${esc(sanaUzun(p.endDate))} gacha</span><span>${qoldi}</span></div>
        <div class="chiziq-ob"><i style="width:${qoldiFoiz}%"></i></div>
      </div>
      <div class="oq-past">
        <div class="malumot">
          <div><small>Keyingi dars</small><b>${esc(keyingiMatn(x.nextLessonAt))}</b></div>
          <div><small>O‘tilgan darslar</small><b>${x.lessonsDone}</b></div>
        </div>
        <button class="dumaloq" type="button" data-amal="chat" aria-label="Chat">${IKON.chat}</button>
        <button class="dumaloq qongiroq" type="button" data-amal="qongiroq" aria-label="Qo‘ng‘iroq">${IKON.qongiroq}</button>
      </div>
    </div>`;
}

function chiz() {
  const q = $('#qidiruv').value.trim().toLowerCase();
  const ro = q ? HAMMASI.filter((x) => ism(x.student).toLowerCase().includes(q)) : HAMMASI;

  $('#royxat').innerHTML = ro.length
    ? ro.map(kartaHtml).join('')
    : HAMMASI.length
      ? '<div class="bosh-holat"><b>Topilmadi</b><span>Boshqa ism bilan qidirib ko‘ring</span></div>'
      : '<div class="bosh-holat"><b>Hali to‘lov qilgan o‘quvchi yo‘q</b>'
        + '<span>Sinov darsidan keyin doimiy darslar uchun to‘lov qilgan o‘quvchilar shu yerda chiqadi</span></div>';

  document.querySelectorAll('.oq').forEach((k) => {
    const och = () => { location.href = `/oquvchi.html?id=${encodeURIComponent(k.dataset.id)}`; };
    k.onclick = (e) => {
      const amal = e.target.closest('[data-amal]');
      if (amal) { e.stopPropagation(); return amalBajar(amal.dataset.amal, k.dataset.id); }
      och();
    };
    k.onkeydown = (e) => { if (e.key === 'Enter' && e.target === k) och(); };
  });
}

function amalBajar(amal, id) {
  // Qo'ng'iroq va chat — ilovaning o'z ekranlari. WebView'dan native tomonga xabar beramiz.
  const xabar = { turi: amal, studentId: id };
  if (window.MyTeacher?.postMessage) window.MyTeacher.postMessage(JSON.stringify(xabar));
  else if (window.flutter_inappwebview?.callHandler) window.flutter_inappwebview.callHandler('mentorAction', xabar);
  else location.href = `/oquvchi.html?id=${encodeURIComponent(id)}`;
}

$('#qidiruv').oninput = chiz;

(async () => {
  await WebViewAuth.tayyorla();
  // Mentor shu sahifada ishlayotganini bildirib turamiz — aks holda tizim uni oflayn deb biladi
  mentorNabzi();
  const r = await api('/api/ai/assignments/my-students/paid');
  if (!r) return;
  if (!r.ok) {
    $('#sarlavha').textContent = 'Yuklab bo‘lmadi';
    $('#royxat').innerHTML = '<div class="bosh-holat"><b>Ro‘yxatni yuklab bo‘lmadi</b>'
      + `<span>${esc(r.data.message || 'Qaytadan urinib ko‘ring')}</span></div>`;
    return;
  }
  HAMMASI = Array.isArray(r.data) ? r.data : [];
  const tugayapti = HAMMASI.filter((x) => x.plan && x.plan.daysLeft <= TUGAYAPTI_KUN).length;
  $('#sarlavha').textContent = `${HAMMASI.length} ta o‘quvchi`;
  $('#izoh').innerHTML = tugayapti
    ? `Doimiy darslar uchun to‘lov qilganlar · <b>${tugayapti} tasining obunasi ${TUGAYAPTI_KUN} kun ichida tugaydi</b>`
    : 'Doimiy darslar uchun to‘lov qilgan o‘quvchilaringiz';
  chiz();
})();
</script>
</body>
</html>
