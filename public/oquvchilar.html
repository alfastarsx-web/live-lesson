<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>O'quvchilar</title>
<link rel="stylesheet" href="/app.css">
<style>
body.oquvchilar{background:var(--bg)}
.oquvchilar .wrap{padding-bottom:40px}
.oq-bosh{margin:16px 0 14px;border-radius:18px;padding:18px;color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.oq-bosh .yorliq{padding:0;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.oq-bosh h1{margin:8px 0 2px;font-size:27px;font-weight:800;letter-spacing:-.6px}
.oq-bosh p{margin:0;font-size:14px;color:var(--mut2)}
.oq-bosh p b{color:var(--amber)}

.oq{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;
  box-shadow:0 1px 2px rgba(35,38,45,.05),0 8px 22px -16px rgba(35,38,45,.25)}
.oq:focus-visible{outline:3px solid #b0874a;outline-offset:2px}
.oq-ust{display:flex;align-items:center;gap:12px}
.oq-ust .avatar{flex:0 0 auto}
.oq-ust .ism{flex:1;min-width:0}
.oq-ust .ism b{display:block;font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oq-ust .ism span{font-size:13px;color:#6b6e76;font-weight:600}
.tarif{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#e8f0ee;color:#2f5751;margin-bottom:8px}

.obuna{margin-top:14px}
.obuna-qator{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:#3a3d45}
.obuna-qator > span:last-child{color:#3d7d5f;font-variant-numeric:tabular-nums;white-space:nowrap}
.oq.tugayapti .obuna-qator > span:last-child{color:#9d7640}
.oq.tugadi .obuna-qator > span:last-child{color:#b85a52}
.chiziq-ob{height:6px;border-radius:6px;background:#e6e6e2;margin-top:7px;overflow:hidden}
.chiziq-ob i{display:block;height:100%;border-radius:6px;background:var(--green)}
.oq.tugayapti .chiziq-ob i{background:#c9a36b}

.oq-past{display:flex;align-items:center;gap:10px;margin-top:14px}
.malumot{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.malumot div{background:#f4f4f1;border-radius:12px;padding:8px 10px}
.malumot small{display:block;font-size:11px;font-weight:700;color:#9a9ca3;white-space:nowrap}
.kutish{margin-top:14px;background:#f6f0e6;border-radius:12px;padding:10px 12px}
.kutish b{display:block;font-size:13.5px;font-weight:800;color:#8a6a36}
.kutish span{font-size:12.5px;color:#7a5d30}
.kutish.obunasiz{background:#fdecea}
.kutish.obunasiz b{color:#b42318}
.kutish.obunasiz span{color:#8f2a1f}
.oq.yopiq{cursor:default}
.malumot b{font-size:13.5px;font-weight:800;color:#23262d;font-variant-numeric:tabular-nums}

/* Darsi jadvalda yo'q — ustoz o'zi vaqt belgilaydi */
.jadvalsiz{margin-top:14px;background:var(--green-soft);border-radius:12px;padding:12px}
.jadvalsiz b{display:block;font-size:13.5px;font-weight:800;color:var(--green)}
.jadvalsiz span{display:block;font-size:12.5px;color:#3a3d45;margin:2px 0 10px}
.jadvalsiz .tugma{width:100%}
.dj{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:3px;font-size:11px}
.dj .bosh{font-weight:800;text-align:center;color:var(--mut2);padding:2px 0 4px;position:sticky;top:0;z-index:1;background:#f4f4f1}
.dj .soat{font-weight:800;color:var(--mut2);text-align:right;padding-right:3px;align-self:center}
.dj button{position:relative;min-width:0;height:30px;padding:0;border-radius:8px;border:1.5px solid #e6e6e2;background:#fff;
  font:inherit;font-size:10px;font-weight:800;color:var(--mut2);cursor:pointer}
.dj button.ish{background:#f3faf6;border-color:#cfe5d8}
.dj button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.dj button:disabled{background:#ececf2;border-color:#ececf2;color:#8a8d96;cursor:not-allowed}
.dj button .nuqta{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#c9a36b}
.dj-izoh{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 4px;font-size:11.5px;color:var(--mut)}
.dj-izoh i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.dj-past{flex:0 0 auto;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid #e6e6e2;background:#f4f4f1}
.dj-tanlov{margin-bottom:10px;font-size:14px;font-weight:700;min-height:20px}
.dj-past .tugma{width:100%}
</style>
</head>
<body class="oquvchilar">
<div class="wrap">
  <section class="oq-bosh" aria-label="O‘quvchilar">
    <div class="yorliq">O‘quvchilar</div>
    <h1 id="sarlavha">…</h1>
    <p id="izoh">Doimiy darslar uchun to‘lov qilgan o‘quvchilaringiz</p>
  </section>

  <nav class="tablar" aria-label="Work bo‘limlari">
    <div class="tablar-ichi statik">
      <a href="/work.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Bugun</span></a>
      <a href="/work.html#sinovlar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.5 5 5.5.8-4 3.9.9 5.5L12 16.1l-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg><span>Sinovlar</span></a>
      <a href="/oquvchilar.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M16 6.5a3 3 0 010 5.6M17.5 14.8c1.6.6 2.6 2 3 4.2"/></svg><span>O‘quvchi</span></a>
      <a href="/jadval.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Jadval</span></a>
      <a href="/daromad.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg><span>Daromad</span></a>
    </div>
  </nav>

  <div class="qidiruv">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
    <input id="qidiruv" placeholder="O‘quvchi qidirish…" autocomplete="off" aria-label="O‘quvchi qidirish">
  </div>

  <div id="royxat">
    <div class="skelet"></div><div class="skelet"></div>
  </div>
</div>

<div class="parda" id="parda"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="djIsm">
  <div class="tutqich"></div>
  <div class="bosh"><b id="djIsm">Dars vaqti</b><span id="djObuna"></span></div>
  <div class="tana">
    <div class="dj" id="dj"></div>
    <div class="dj-izoh">
      <span><i style="background:var(--green)"></i>Tanlangan</span>
      <span><i style="background:#f3faf6;border:1.5px solid #cfe5d8"></i>Ish vaqtingiz</span>
      <span><i style="background:#ececf2"></i>Band</span>
      <span><i style="background:#c9a36b;border-radius:50%"></i>Sinov darsi bor</span>
    </div>
  </div>
  <div class="dj-past">
    <div class="dj-tanlov" id="djTanlov">Har bir dars kuni uchun bitta soatni bosing</div>
    <button class="tugma" type="button" id="djSaqla" disabled>Saqlash</button>
  </div>
</div>

<script src="/auth-webview.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const OYLAR_T = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
const TUGAYAPTI_KUN = 5; // obuna shuncha kun qolganda ogohlantiriladi
let HAMMASI = [];

const IKON = {
  chat: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1.2-4.2A8 8 0 1 1 21 12Z" stroke-linejoin="round"/></svg>',
  qongiroq: '<svg viewBox="0 0 24 24"><path d="M6.6 3h3l1.5 4-2 1.4a12 12 0 0 0 5.5 5.5l1.4-2 4 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4.6 5.2 2 2 0 0 1 6.6 3Z" stroke-linejoin="round"/></svg>',
};

const ism = (s) => s.fullName || [s.firstName, s.lastName].filter(Boolean).join(' ') || 'Noma‘lum';
const sanaUzun = (iso) => { const d = new Date(iso); return `${d.getDate()}-${OYLAR_T[d.getMonth()]}`; };
const kunBoshi = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
function keyingiMatn(iso) {
  if (!iso) return '—';
  const farq = Math.round((kunBoshi(iso) - kunBoshi(Date.now())) / 86400000);
  const soat = soatQisqa(iso);
  if (farq === 0) return `Bugun ${soat}`;
  if (farq === 1) return `Ertaga ${soat}`;
  return `${sanaUzun(iso)} ${soat}`;
}

// Mentor "To'lov qildi" belgilagan, operator hali obunani kiritmagan. Biriktirma yo'q (assignmentId null) —
// admin to'lovni tasdiqlab doimiy darslarni qo'ymaguncha chat, qo'ng'iroq va dars ochilmaydi.
// Admin biriktirgan, lekin ustozli obunasi yo'q / tugagan o'quvchi ham shu kartada (yo'qolib qolmasin)
function kutilayotganHtml(x) {
  const yopiq = !x.assignmentId;
  const obunasiz = !yopiq && (x.subscriptionState === 'yoq' || x.subscriptionState === 'tugagan');
  return `
    <div class="oq kutilmoqda${yopiq ? ' yopiq' : ''}" data-id="${esc(x.student.id)}" ${yopiq ? 'aria-disabled="true"' : 'tabindex="0" role="link"'} aria-label="${esc(ism(x.student))}">
      <div class="oq-ust">
        <div class="avatar">${esc(bosh(ism(x.student)))}</div>
        <div class="ism">
          <b>${esc(ism(x.student))}</b>
          <span>${x.student.phoneNumber ? esc(x.student.phoneNumber) : 'O‘quvchi'}</span>
        </div>
      </div>
      <div class="kutish${obunasiz ? ' obunasiz' : ''}">
        <b>${obunasiz ? (x.subscriptionState === 'tugagan' ? '⚠️ Obunasi tugagan' : '⚠️ Obuna yo‘q') : 'To‘lov tasdiqlanmoqda'}</b>
        <span>${yopiq
          ? 'Admin to‘lovni tasdiqlab, dars jadvalini qo‘ygach o‘quvchi sizga biriktiriladi — shundan keyin chat va darslar ochiladi.'
          : obunasiz
            ? 'O‘quvchi sizga biriktirilgan, lekin to‘lovi kiritilmagan. To‘lov qilinmaguncha doimiy dars o‘tkazmang — o‘quvchi bilan gaplashing, to‘lagan bo‘lsa adminga yozing.'
            : 'Operator to‘lovni kiritgach, tarif va obuna muddati shu yerda chiqadi.'}</span>
      </div>
      ${yopiq ? '' : `<div class="oq-past">
        <div class="malumot">
          <div><small>Keyingi dars</small><b>${esc(keyingiMatn(x.nextLessonAt))}</b></div>
          <div><small>O‘tilgan darslar</small><b>${x.lessonsDone}</b></div>
        </div>
        <button class="dumaloq" type="button" data-amal="chat" aria-label="Chat">${IKON.chat}</button>
        <button class="dumaloq qongiroq" type="button" data-amal="qongiroq" aria-label="Qo‘ng‘iroq">${IKON.qongiroq}</button>
      </div>`}
    </div>`;
}

function kartaHtml(x) {
  if (!x.plan) return kutilayotganHtml(x);
  const p = x.plan;
  const jami = Math.max(1, new Date(p.endDate) - new Date(p.startDate));
  const qoldiFoiz = Math.max(0, Math.min(100, ((new Date(p.endDate) - Date.now()) / jami) * 100));
  const holat = p.daysLeft <= 0 ? 'tugadi' : p.daysLeft <= TUGAYAPTI_KUN ? 'tugayapti' : '';
  const qoldi = p.daysLeft <= 0 ? 'bugun tugaydi' : `${p.daysLeft} kun qoldi`;
  return `
    <div class="oq ${holat}" data-id="${esc(x.student.id)}" tabindex="0" role="link" aria-label="${esc(ism(x.student))}">
      <div class="oq-ust">
        <div class="avatar">${esc(bosh(ism(x.student)))}</div>
        <div class="ism">
          <b>${esc(ism(x.student))}</b>
          <span>${x.student.phoneNumber ? esc(x.student.phoneNumber) : 'O‘quvchi'}</span>
        </div>
      </div>
      <div class="obuna">
        <span class="tarif">${esc(p.name)}</span>
        <div class="obuna-qator"><span>Obuna ${esc(sanaUzun(p.endDate))} gacha</span><span>${qoldi}</span></div>
        <div class="chiziq-ob"><i style="width:${qoldiFoiz}%"></i></div>
      </div>
      ${x.assignmentId && !x.nextLessonAt && p.daysLeft > 0 ? `
      <div class="jadvalsiz">
        <b>📅 Darslari hali jadvalda yo‘q</b>
        <span>Dars vaqtini belgilang — o‘quvchiga xabar boradi va bu soatlarga sinov darslari tushmaydi.</span>
        <button class="tugma" type="button" data-amal="jadval">Dars vaqtini belgilash</button>
      </div>` : ''}
      <div class="oq-past">
        <div class="malumot">
          <div><small>Keyingi dars</small><b>${esc(keyingiMatn(x.nextLessonAt))}</b></div>
          <div><small>O‘tilgan darslar</small><b>${x.lessonsDone}</b></div>
        </div>
        <button class="dumaloq" type="button" data-amal="chat" aria-label="Chat">${IKON.chat}</button>
        <button class="dumaloq qongiroq" type="button" data-amal="qongiroq" aria-label="Qo‘ng‘iroq">${IKON.qongiroq}</button>
      </div>
    </div>`;
}

function chiz() {
  const q = $('#qidiruv').value.trim().toLowerCase();
  const ro = q ? HAMMASI.filter((x) => ism(x.student).toLowerCase().includes(q)) : HAMMASI;

  $('#royxat').innerHTML = ro.length
    ? ro.map(kartaHtml).join('')
    : HAMMASI.length
      ? '<div class="bosh-holat"><b>Topilmadi</b><span>Boshqa ism bilan qidirib ko‘ring</span></div>'
      : '<div class="bosh-holat"><b>Hali o‘quvchi yo‘q</b>'
        + '<span>Sinov darsidan keyin to‘lov qilgan yoki admin sizga biriktirgan o‘quvchilar shu yerda chiqadi</span></div>';

  document.querySelectorAll('.oq:not(.yopiq)').forEach((k) => {
    const och = () => { location.href = `/oquvchi.html?id=${encodeURIComponent(k.dataset.id)}`; };
    k.onclick = (e) => {
      const amal = e.target.closest('[data-amal]');
      if (amal) { e.stopPropagation(); return amalBajar(amal.dataset.amal, k.dataset.id); }
      och();
    };
    k.onkeydown = (e) => { if (e.key === 'Enter' && e.target === k) och(); };
  });
}

function amalBajar(amal, id) {
  if (amal === 'jadval') return jadvalOch(id);
  // Qo'ng'iroq va chat — ilovaning o'z ekranlari. WebView'dan native tomonga xabar beramiz.
  const xabar = { turi: amal, studentId: id };
  if (window.MyTeacher?.postMessage) window.MyTeacher.postMessage(JSON.stringify(xabar));
  else if (window.flutter_inappwebview?.callHandler) window.flutter_inappwebview.callHandler('mentorAction', xabar);
  else location.href = `/oquvchi.html?id=${encodeURIComponent(id)}`;
}

// ---------- Dars vaqtini belgilash (darsi jadvalda yo'q o'quvchi) ----------
const KUN_TARTIB = [1, 2, 3, 4, 5, 6, 0];
const KUN_QISQA = ['Ya', 'Du', 'Se', 'Chor', 'Pa', 'Ju', 'Sha'];
const SOATLAR = Array.from({ length: 17 }, (_, i) => 6 + i);
const ikki = (n) => String(n).padStart(2, '0');
let DJ = null; // { id, slots: Map("wd|min" -> slot), tanlangan: Map(wd -> min) }

function toast(matn, tur = '') {
  const t = document.createElement('div');
  t.className = `toast ${tur}`;
  t.setAttribute('role', 'status');
  t.textContent = matn;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4500);
}

function sheetOch(ochiq) {
  $('#sheet').classList.toggle('ochiq', ochiq);
  $('#parda').classList.toggle('ochiq', ochiq);
}
$('#parda').onclick = () => sheetOch(false);

function tanlovMatni() {
  const t = KUN_TARTIB.filter((wd) => DJ.tanlangan.has(wd));
  if (!t.length) return 'Har bir dars kuni uchun bitta soatni bosing';
  const soatlar = [...new Set(t.map((wd) => DJ.tanlangan.get(wd)))];
  const vaqt = soatlar.length === 1
    ? `${t.map((wd) => KUN_QISQA[wd]).join(', ')} · ${ikki(soatlar[0] / 60)}:00`
    : t.map((wd) => `${KUN_QISQA[wd]} ${ikki(DJ.tanlangan.get(wd) / 60)}:00`).join(', ');
  return `Haftada ${t.length} marta: ${vaqt}`;
}

function djChiz() {
  let h = '<div class="bosh"></div>' + KUN_TARTIB.map((wd) => `<div class="bosh">${KUN_QISQA[wd]}</div>`).join('');
  for (const soat of SOATLAR) {
    h += `<div class="soat">${ikki(soat)}</div>`;
    for (const wd of KUN_TARTIB) {
      const s = DJ.slots.get(`${wd}|${soat * 60}`) || {};
      const band = s.state === 'busy' || s.state === 'held';
      const tanlandi = DJ.tanlangan.get(wd) === soat * 60;
      const nom = band ? `${KUN_QISQA[wd]} ${ikki(soat)}:00 — band${s.studentName ? ` (${s.studentName})` : ''}` : `${KUN_QISQA[wd]} ${ikki(soat)}:00`;
      h += `<button type="button" class="${s.ish ? 'ish' : ''}" data-wd="${wd}" data-m="${soat * 60}" aria-pressed="${tanlandi}"`
        + ` aria-label="${esc(nom)}" ${band ? 'disabled' : ''}>${s.trials && !band ? '<span class="nuqta"></span>' : ''}</button>`;
    }
  }
  $('#dj').innerHTML = h;
  $('#djTanlov').textContent = tanlovMatni();
  $('#djSaqla').disabled = !DJ.tanlangan.size;
}

$('#dj').onclick = (e) => {
  const b = e.target.closest('button[data-wd]');
  if (!b || b.disabled) return;
  const wd = Number(b.dataset.wd);
  const m = Number(b.dataset.m);
  // Kuniga bitta dars: shu kunning boshqa soati bosilsa — o'shanga o'tadi
  if (DJ.tanlangan.get(wd) === m) DJ.tanlangan.delete(wd); else DJ.tanlangan.set(wd, m);
  djChiz();
};

async function jadvalOch(id) {
  const r = await api(`/api/ai/lesson-booking/mentor/jadval/${encodeURIComponent(id)}`);
  if (!r) return;
  if (!r.ok) return toast(r.data.message || 'Ochib bo‘lmadi, qaytadan urinib ko‘ring', 'err');
  DJ = { id, slots: new Map(r.data.slots.map((s) => [`${s.weekday}|${s.minute}`, s])), tanlangan: new Map() };
  $('#djIsm').textContent = r.data.student.ism || 'O‘quvchi';
  $('#djObuna').textContent = `Obuna ${sanaUzun(r.data.obunaGacha)} gacha — darslar shu kungacha qo‘yiladi`;
  djChiz();
  sheetOch(true);
}

$('#djSaqla').onclick = async () => {
  const slots = [...DJ.tanlangan].map(([weekday, minute]) => ({ weekday, minute }));
  $('#djSaqla').disabled = true;
  $('#djSaqla').textContent = 'Saqlanmoqda…';
  const r = await api('/api/ai/lesson-booking/mentor/jadval', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ studentUserId: DJ.id, slots }),
  });
  $('#djSaqla').textContent = 'Saqlash';
  if (!r) return;
  if (!r.ok) { $('#djSaqla').disabled = false; return toast(r.data.message || 'Saqlab bo‘lmadi, qaytadan urinib ko‘ring', 'err'); }
  sheetOch(false);
  const otdi = r.data.skipped?.length ? ` ${r.data.skipped.length} ta sana band bo‘lgani uchun o‘tkazildi.` : '';
  toast(`✅ ${r.data.created} ta dars jadvalga qo‘yildi. Birinchisi: ${r.data.birinchi}.${otdi}`, 'ok');
  yukla();
};

$('#qidiruv').oninput = chiz;

async function yukla() {
  const r = await api('/api/ai/assignments/my-students/paid');
  if (!r) return;
  if (!r.ok) {
    $('#sarlavha').textContent = 'Yuklab bo‘lmadi';
    $('#royxat').innerHTML = '<div class="bosh-holat"><b>Ro‘yxatni yuklab bo‘lmadi</b>'
      + `<span>${esc(r.data.message || 'Qaytadan urinib ko‘ring')}</span></div>`;
    return;
  }
  HAMMASI = Array.isArray(r.data) ? r.data : [];
  const tugayapti = HAMMASI.filter((x) => x.plan && x.plan.daysLeft <= TUGAYAPTI_KUN).length;
  const obunasiz = HAMMASI.filter((x) => x.assignmentId && (x.subscriptionState === 'yoq' || x.subscriptionState === 'tugagan')).length;
  $('#sarlavha').textContent = `${HAMMASI.length} ta o‘quvchi`;
  $('#izoh').innerHTML = [
