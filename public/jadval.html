<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mening jadvalim — Jonli dars</title>
<link rel="stylesheet" href="/jadval.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mening jadvalim</h1>
    <span class="who" id="who"></span>
    <button class="ghost kichik" id="chiqish">Chiqish</button>
  </header>

  <div class="card">
    <h2>Kelgusi darslar</h2>
    <div id="darslar"><div class="bosh">Yuklanmoqda…</div></div>
  </div>

  <div class="card">
    <h2>Haftalik bo‘sh vaqtlarim</h2>
    <p class="sub">O‘quvchilar faqat shu oraliqlardan 30 daqiqalik dars band qila oladi.</p>
    <div id="kunlar"></div>
    <div style="margin-top:16px;display:flex;gap:10px;align-items:center">
      <button id="saqla">Saqlash</button>
      <span class="xabar" id="xabar"></span>
    </div>
  </div>
</div>

<script>
const KUNLAR = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const $ = (s) => document.querySelector(s);

function vaqtVariantlari(sel, tanlangan) {
  for (let m = 0; m <= 1440; m += 30) {
    const o = document.createElement('option');
    o.value = m;
    o.textContent = `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
    if (m === tanlangan) o.selected = true;
    sel.appendChild(o);
  }
}

function kunQatori(i) {
  const row = document.createElement('div');
  row.className = 'kun';
  row.innerHTML = `<input type="checkbox" data-k="${i}">
    <span class="nom">${KUNLAR[i]}</span>
    <select data-b="${i}"></select><span class="ora">—</span><select data-t="${i}"></select>`;
  vaqtVariantlari(row.querySelector(`[data-b="${i}"]`), 540);
  vaqtVariantlari(row.querySelector(`[data-t="${i}"]`), 1080);
  const cb = row.querySelector('input');
  const yangila = () => row.querySelectorAll('select').forEach((s) => { s.disabled = !cb.checked; });
  cb.onchange = yangila; yangila();
  return row;
}

for (let i = 1; i <= 6; i++) $('#kunlar').appendChild(kunQatori(i));
$('#kunlar').appendChild(kunQatori(0));   // yakshanba oxirida

let SESSIYA_BOR = false;   // whoami tasdiqlagach true bo'ladi

async function api(yol, opts) {
  const r = await fetch(yol, opts);
  // Sessiya bor-u, lekin jadval API 401 bersa — login'ga otmaymiz, aks holda aylanma bo'ladi
  if (r.status === 401 && !SESSIYA_BOR) {
    location.href = '/login.html?keyin=' + encodeURIComponent(location.pathname);
    return null;
  }
  return { ok: r.ok, data: await r.json().catch(() => ({})) };
}

async function jadvalniYukla() {
  const r = await api('/api/booking/availability');
  if (!r) return;
  if (!r.ok) return;
  for (const item of r.data) {
    const cb = document.querySelector(`input[data-k="${item.weekday}"]`);
    if (!cb) continue;
    cb.checked = true;
    document.querySelector(`select[data-b="${item.weekday}"]`).value = item.startMinute;
    document.querySelector(`select[data-t="${item.weekday}"]`).value = item.endMinute;
    cb.dispatchEvent(new Event('change'));
  }
}

$('#saqla').onclick = async () => {
  const items = [];
  document.querySelectorAll('input[data-k]').forEach((cb) => {
    if (!cb.checked) return;
    const k = cb.dataset.k;
    items.push({
      weekday: Number(k),
      startMinute: Number(document.querySelector(`select[data-b="${k}"]`).value),
      endMinute: Number(document.querySelector(`select[data-t="${k}"]`).value),
    });
  });
  const yomon = items.find((i) => i.endMinute <= i.startMinute);
  if (yomon) return xabar(`${KUNLAR[yomon.weekday]}: tugash vaqti boshlanishdan keyin bo‘lsin`, 'err');

  $('#saqla').disabled = true;
  const r = await api('/api/booking/availability', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items }),
  });
  $('#saqla').disabled = false;
  if (!r) return;
  xabar(r.ok ? 'Saqlandi' : (r.data.message || 'Saqlab bo‘lmadi'), r.ok ? 'ok' : 'err');
};

function xabar(t, turi) {
  $('#xabar').textContent = t;
  $('#xabar').className = 'xabar ' + (turi || '');
  if (turi === 'ok') setTimeout(() => { $('#xabar').textContent = ''; }, 3000);
}

function vaqtMatni(iso) {
  const d = new Date(iso);
  return d.toLocaleString('uz-UZ', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

async function darslarniYukla() {
  const r = await api('/api/booking/mentor/my');
  if (!r) return;
  const box = $('#darslar');
  if (!r.ok || !Array.isArray(r.data) || !r.data.length) {
    box.innerHTML = '<div class="bosh">Hozircha band qilingan dars yo‘q</div>';
    return;
  }
  box.innerHTML = '';
  for (const d of r.data) {
    const row = document.createElement('div');
    row.className = 'dars';
    row.innerHTML = `<span class="vaqt">${vaqtMatni(d.startsAt)}</span>
      <span class="kim">${d.studentName || 'O‘quvchi'}</span>`;
    const btn = document.createElement('button');
    btn.className = 'kichik';
    btn.textContent = 'Kirish';
    btn.onclick = () => kirish(d.id, btn);
    row.appendChild(btn);
    box.appendChild(row);
  }
}

async function kirish(id, btn) {
  btn.disabled = true;
  const r = await api(`/api/booking/${id}/entry`);
  btn.disabled = false;
  if (!r) return;
  if (r.ok && r.data.url) location.href = r.data.url;
  else xabar(r.data.message || 'Hozircha kirib bo‘lmaydi', 'err');
}

$('#chiqish').onclick = async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login.html';
};

(async () => {
  const w = await api('/api/whoami');
  if (!w) return;
  SESSIYA_BOR = w.ok;
  if (w.ok && w.data.name) $('#who').textContent = w.data.name;

  // Zaxira hisob (teachers.json) bilan kirilgan bo'lsa jadval mavjud emas
  if (w.ok && !w.data.hasSchedule) {
    $('#darslar').innerHTML = '<div class="bosh">Jadval faqat MyTeacher hisobi bilan ishlaydi. '
      + 'Telefon raqamingiz va parolingiz bilan qayta kiring.</div>';
    $('#kunlar').style.opacity = '.4';
    $('#saqla').disabled = true;
    return;
  }

  await Promise.all([jadvalniYukla(), darslarniYukla()]);
})();
</script>
</body>
</html>
