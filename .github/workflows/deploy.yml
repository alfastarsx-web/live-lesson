# main ga merge bo'lishi bilan prod serverga deploy (46.8.195.59, pm2: live-lesson).
# Kerak: repo Settings → Secrets → Actions → DEPLOY_SSH_KEY (serverdagi /root/.ssh/github_deploy).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH kalit
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$KEY" || { echo "DEPLOY_SSH_KEY sozlanmagan"; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 root@46.8.195.59 'bash -s' <<'SH'
          set -e
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd /var/www/live-lesson
          # Serverda qo'lda o'zgartirilgan fayllar (README.md, public/lidlar.html) saqlanadi;
          # ular bilan to'qnashsa pull to'xtaydi va deploy qizil bo'ladi
          git pull --no-edit
          node --check server.js
          pm2 restart live-lesson
          git log --oneline -1
          SH
